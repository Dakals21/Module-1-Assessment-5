<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Dakalo Ecommerce Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #1428A0;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        .content {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
        }

        h2 {
            color: #1428A0;
        }

        .contact-info {
            line-height: 1.8;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 14px;
            background: #1428A0;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #0c1b75;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<header>
    <h1>Dakalo Ecommerce Store</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="About.html">About</a>
        <a href="Contact.html">Contact Us</a>
    </nav>
</header>

<section class="content">

    <h2>Contact Us</h2>

    <div class="contact-info">
        <p><strong>Address:</strong> 102 Discovery Lane, Sandton Johannesburg, South Africa</p>
        <p><strong>Phone:</strong> +27 11 644 6754</p>
        <p><strong>Email:</strong> info@dakaloestore.co.za</p>
        <p><strong>Business Hours:</strong> Monday - Friday, 08:00 - 17:00</p>
    </div>

    <h2>Send Us a Message</h2>

    <form onsubmit="sendMessage(event)">

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="subject">Subject</label>
        <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Enter the subject"
            required
        >

        <label for="message">Message</label>
        <textarea
            id="message"
            name="message"
            placeholder="Write your message here..."
            required
        ></textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>

<footer>
    <p>&copy; 2026 Dakalo Ecommerce Store. All Rights Reserved.</p>
</footer>

<script>
    function sendMessage(event) {
        event.preventDefault();

        alert("Thank you! Your message has been received.");

        event.target.reset();
    }
</script>

</body>
</html>
